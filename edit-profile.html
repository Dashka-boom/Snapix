<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Snapix</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body[data-page="edit-profile"] {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 0%, rgba(56, 189, 248, 0.18), transparent 45%),
                radial-gradient(circle at 85% 5%, rgba(147, 51, 234, 0.2), transparent 42%),
                #07090e;
            color: #f8fafc;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .header {
            background: rgba(7, 9, 14, 0.78);
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
            backdrop-filter: blur(14px);
        }

        .nav {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0.8rem 1.25rem;
        }

        .logo,
        .menu a {
            color: #e2e8f0;
        }

        .search {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.3);
            color: #f8fafc;
        }

        .search::placeholder {
            color: #94a3b8;
        }

        .edit-layout {
            width: min(1080px, 100% - 2rem);
            margin: 2rem auto 2.5rem;
            display: grid;
            gap: 1.5rem;
        }

        .edit-shell {
            overflow: hidden;
            border-radius: 24px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(15, 23, 42, 0.72);
            box-shadow: 0 25px 70px rgba(2, 6, 23, 0.52);
        }

        .edit-cover {
            position: relative;
            min-height: 280px;
            background: linear-gradient(145deg, #2c1914, #4f2a24 45%, #2e1d1a);
            background-size: cover;
            background-position: center;
        }

        .cover-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(2, 6, 23, 0.08) 0%, rgba(2, 6, 23, 0.72) 100%);
        }

        .file-trigger {
            position: absolute;
            z-index: 2;
            width: 56px;
            height: 56px;
            border: 0;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.76);
            color: #f8fafc;
            box-shadow: 0 8px 20px rgba(2, 6, 23, 0.35);
            transition: transform 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
        }

        .file-trigger:hover,
        .file-trigger:focus-visible {
            background: rgba(30, 41, 59, 0.95);
            transform: translateY(-1px);
            outline: none;
        }

        .cover-trigger {
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .cover-trigger:hover,
        .cover-trigger:focus-visible {
            transform: translate(-50%, -52%);
        }

        .camera-icon {
            width: 23px;
            height: 23px;
            fill: currentColor;
            pointer-events: none;
        }

        .edit-summary {
            position: relative;
            z-index: 3;
            margin: -72px 1.2rem 1.4rem;
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(11, 18, 32, 0.96);
            padding: 1.2rem;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 1.05rem;
            align-items: center;
        }

        .avatar-shell {
            position: relative;
            width: 114px;
            height: 114px;
            border-radius: 50%;
            border: 4px solid rgba(11, 18, 32, 0.97);
            background: rgba(30, 41, 59, 0.9);
            overflow: visible;
        }

        .avatar-preview {
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(145deg, #334155, #1e293b);
            background-size: cover;
            background-position: center;
        }

        .avatar-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: #cbd5e1;
        }

        .avatar-trigger {
            right: -2px;
            bottom: -2px;
            width: 42px;
            height: 42px;
            border: 2px solid rgba(11, 18, 32, 0.98);
        }

        .summary-copy h1 {
            margin: 0;
            font-size: clamp(1.35rem, 2.2vw, 1.9rem);
            font-weight: 700;
            color: #f8fafc;
        }

        .summary-copy p {
            margin: 0.45rem 0 0;
            color: #94a3b8;
            max-width: 60ch;
        }

        .edit-form {
            background: rgba(11, 18, 32, 0.96);
            border-radius: 24px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 1.35rem;
            display: grid;
            gap: 1rem;
        }

        .field-grid {
            display: grid;
            gap: 0.95rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .field {
            display: grid;
            gap: 0.35rem;
        }

        .field.full {
            grid-column: span 2;
        }

        .field label {
            font-size: 0.86rem;
            color: #cbd5e1;
        }

        .field input,
        .field textarea {
            width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            background: rgba(15, 23, 42, 0.92);
            color: #f8fafc;
            font: inherit;
            padding: 0.75rem 0.85rem;
        }

        .field textarea {
            min-height: 110px;
            resize: vertical;
        }

        .field input:focus,
        .field textarea:focus {
            outline: none;
            border-color: rgba(56, 189, 248, 0.8);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
        }

        .actions {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
        }

        .action-btn {
            border: 0;
            border-radius: 999px;
            padding: 0.7rem 1.2rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: #fff;
        }

        .action-btn.secondary {
            background: rgba(30, 41, 59, 0.95);
            color: #e2e8f0;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 760px) {
            .edit-summary {
                grid-template-columns: 1fr;
                text-align: center;
                justify-items: center;
            }

            .field-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .actions {
                justify-content: stretch;
                flex-direction: column;
            }

            .action-btn {
                text-align: center;
            }
        }
    </style>
</head>
<body data-page="edit-profile">
    <header class="header">
        <nav class="nav">
            <a href="index.php" class="logo">Snapix</a>
            <input type="text" class="search" placeholder="Поиск">
            <div class="menu">
                <a href="#">Reels</a>
                <a href="profile.php" class="user-avatar-link" aria-label="Открыть профиль">
                    <span class="user-avatar">S</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="edit-layout">
        <section class="edit-shell" aria-labelledby="edit-profile-title">
            <div class="edit-cover" id="coverPreview">
                <div class="cover-overlay" aria-hidden="true"></div>
                <input type="file" id="coverInput" accept="image/*" class="sr-only">
                <button type="button" class="file-trigger cover-trigger" data-target-input="coverInput" aria-label="Изменить обложку профиля">
                    <svg viewBox="0 0 24 24" class="camera-icon" aria-hidden="true">
                        <path d="M9 4.5 7.7 6H5.5A2.5 2.5 0 0 0 3 8.5v9A2.5 2.5 0 0 0 5.5 20h13a2.5 2.5 0 0 0 2.5-2.5v-9A2.5 2.5 0 0 0 18.5 6h-2.2L15 4.5H9Zm3 12a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Zm0-1.8a2.7 2.7 0 1 0 0-5.4 2.7 2.7 0 0 0 0 5.4Z"/>
                    </svg>
                </button>
            </div>

            <div class="edit-summary">
                <div class="avatar-shell">
                    <div class="avatar-preview avatar-fallback" id="avatarPreview">S</div>
                    <input type="file" id="avatarInput" accept="image/*" class="sr-only">
                    <button type="button" class="file-trigger avatar-trigger" data-target-input="avatarInput" aria-label="Изменить фото профиля">
                        <svg viewBox="0 0 24 24" class="camera-icon" aria-hidden="true">
                            <path d="M9 4.5 7.7 6H5.5A2.5 2.5 0 0 0 3 8.5v9A2.5 2.5 0 0 0 5.5 20h13a2.5 2.5 0 0 0 2.5-2.5v-9A2.5 2.5 0 0 0 18.5 6h-2.2L15 4.5H9Zm3 12a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Zm0-1.8a2.7 2.7 0 1 0 0-5.4 2.7 2.7 0 0 0 0 5.4Z"/>
                        </svg>
                    </button>
                </div>

                <div class="summary-copy">
                    <h1 id="edit-profile-title">Редактирование профиля</h1>
                    <p>Обновите шапку профиля, фото и личные данные. Клик по иконкам камеры открывает проводник для загрузки новых изображений.</p>
                </div>
            </div>
        </section>

        <form class="edit-form" action="#" method="post">
            <div class="field-grid">
                <div class="field">
                    <label for="username">Логин</label>
                    <input id="username" name="username" type="text" placeholder="snapix.user" required>
                </div>
                <div class="field">
                    <label for="email">Электронная почта</label>
                    <input id="email" name="email" type="email" placeholder="you@snapix.app" required>
                </div>
                <div class="field full">
                    <label for="bio">О себе</label>
                    <textarea id="bio" name="bio" placeholder="Расскажите пару слов о себе"></textarea>
                </div>
            </div>
            <div class="actions">
                <a href="profile.php" class="action-btn secondary">Отмена</a>
                <button type="submit" class="action-btn primary">Сохранить изменения</button>
            </div>
        </form>
    </main>

    <script>
        const previewBindings = [
            { inputId: 'avatarInput', previewId: 'avatarPreview', isAvatar: true },
            { inputId: 'coverInput', previewId: 'coverPreview', isAvatar: false }
        ];

        const updatePreviewImage = (input, previewElement, isAvatar) => {
            const [file] = input.files || [];
            if (!file) return;

            const objectUrl = URL.createObjectURL(file);

            if (isAvatar) {
                previewElement.style.backgroundImage = `url('${objectUrl}')`;
                previewElement.classList.remove('avatar-fallback');
                previewElement.textContent = '';
            } else {
                previewElement.style.backgroundImage = `url('${objectUrl}')`;
            }

            input.dataset.objectUrl = objectUrl;
        };

        previewBindings.forEach(({ inputId, previewId, isAvatar }) => {
            const input = document.getElementById(inputId);
            const previewElement = document.getElementById(previewId);

            input.addEventListener('change', () => {
                if (input.dataset.objectUrl) {
                    URL.revokeObjectURL(input.dataset.objectUrl);
                }
                updatePreviewImage(input, previewElement, isAvatar);
            });
        });

        document.querySelectorAll('[data-target-input]').forEach((button) => {
            button.addEventListener('click', () => {
                const targetInput = document.getElementById(button.dataset.targetInput);
                targetInput?.click();
            });
        });
    </script>
</body>
