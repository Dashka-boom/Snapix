<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="auth.css">
    <title>Snapix</title>
</head>
<body data-page="login">
    <main class="auth-page">
        <section class="auth-card">
            <a href="index.php" class="back-link" aria-label="Вернуться на главную">
                <span aria-hidden="true">←</span>
            </a>
            <h1>Вход в аккаунт</h1>
            <p class="subtitle">Продолжайте делиться моментами, смотреть Reels и общаться с друзьями</p>

            <form class="auth-form" data-auth-form="login">
                <label>
                    <input type="text" name="login" placeholder="Логин или адрес электронной почты" required>
                </label>

                <label>
                    <input type="password" name="password" placeholder="Пароль" required>
                </label>

                <div class="auth-options">
                    <label class="checkbox remember-option">
                        <input type="checkbox" name="remember">
                        <span>Запомнить меня</span>
                    </label>
                    <a href="#" class="link">Забыли пароль?</a>
                </div>

                <p class="form-status" data-form-status aria-live="polite"></p>
                <button type="submit" class="submit-btn">Войти</button>
            </form>

            <div class="divider"><span>или</span></div>

            <p class="switch-text">
                Ещё нет аккаунта?
                <a href="registr.html" class="link">Создать профиль</a>
            </p>
        </section>
    </main>
</body>
</html>
