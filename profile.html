<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Snapix</title>
</head>
<body data-page="profile">
    <div id="profile-top"></div>

    <header class="profile-sticky-nav" data-profile-topbar tabindex="0" role="button" aria-label="Вернуться к началу профиля">
        <div class="profile-nav-inner">
            <a href="index.php" class="profile-nav-back" data-profile-back aria-label="На главную">←</a>
            <div class="profile-nav-title" data-profile-nav-name>Профиль</div>
        </div>
    </header>

    <main class="profile-page">
        <section class="profile-cover card-surface" data-profile-cover></section>

        <section class="profile-summary card-surface">
            <div class="profile-header">
                <div class="profile-avatar-shell">
                    <div class="profile-avatar" data-profile-avatar></div>
                </div>

                <div class="profile-main">
                    <h1 class="profile-username" data-profile-username></h1>

                    <div class="profile-metrics">
                        <div class="profile-metric">
                            <strong data-metric-following>0</strong>
                            <span>Подписки</span>
                        </div>
                        <div class="profile-metric">
                            <strong data-metric-followers>0</strong>
                            <span>Подписчики</span>
                        </div>
                        <div class="profile-metric">
                            <strong data-metric-posts>0</strong>
                            <span>Публикации</span>
                        </div>
                    </div>

                    <p class="profile-bio" data-profile-bio></p>
                </div>

                <a href="edit-profile.html" class="secondary-link profile-edit-btn">Изменить профиль</a>
            </div>
        </section>

        <section class="profile-posts card-surface">
            <div class="section-heading">
                <h2>Публикации</h2>
            </div>

            <div class="posts-grid is-hidden" data-profile-posts></div>
            <p class="empty-state is-hidden" data-profile-empty-posts>Пока нет публикаций. Добавьте первую публикацию и начните собирать свою ленту.</p>
        </section>
    </main>
</body>
</html>
