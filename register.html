<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="auth.css">
    <title>Snapix</title>
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <a href="index.html" class="brand">Snapix</a>
            <h1>Создание аккаунта</h1>
            <p class="subtitle">Зарегистрируйтесь, чтобы публиковать фото, находить друзей и собирать свою ленту.</p>

            <form class="auth-form">
                <label>
                    Имя
                    <input type="text" name="name" placeholder="Введите ваше имя" required>
                </label>

                <label>
                    Email
                    <input type="email" name="email" placeholder="Введите email" required>
                </label>

                <label>
                    Логин
                    <input type="text" name="username" placeholder="Придумайте логин" required>
                </label>

                <label>
                    Пароль
                    <input type="password" name="password" placeholder="Создайте пароль" required>
                </label>

                <label>
                    Подтвердите пароль
                    <input type="password" name="confirm-password" placeholder="Повторите пароль" required>
                </label>

                <label class="checkbox">
                    <input type="checkbox" name="agreement" required>
                    <span>Я принимаю условия использования и политику конфиденциальности</span>
                </label>

                <button type="submit" class="submit-btn">Зарегистрироваться</button>
            </form>

            <div class="divider"><span>или</span></div>

            <p class="switch-text">
                Уже есть аккаунт?
                <a href="login.html" class="link">Войти</a>
            </p>
        </section>
    </main>
</body>
</html>
